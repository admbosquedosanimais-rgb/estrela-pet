<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Clube Estrela Pet — Cuidar é um verbo. Em todas as fases.</title>
<style>
  html, body { margin: 0; padding: 0; background: #163927; }
  body {
    font-family: 'Geist', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    min-height: 100vh; color: #F5EFE0;
  }
  *, *:before, *:after { box-sizing: border-box; }
  button, input, a { font-family: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(225,182,95,0.4); color: #F5EFE0; }

  #stage { display:flex; justify-content:center; align-items:flex-start; padding: 0; }
  @media (min-width: 480px) {
    #stage { padding: 32px 0; background: #0A2014; min-height: 100vh; }
    #stage > div {
      box-shadow:
        0 50px 120px -30px rgba(0,0,0,0.7),
        0 0 80px -20px rgba(225,182,95,0.18),
        0 0 0 1px rgba(245,239,224,0.06);
      border-radius: 12px; overflow: hidden;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="src/image-slot.js"></script>

<!-- Shared tokens, widgets, mockups, signup -->
<script type="text/babel" src="src/tokens.jsx"></script>
<script type="text/babel" src="src/widgets.jsx"></script>
<script type="text/babel" src="src/mockups.jsx"></script>
<script type="text/babel" src="src/asaas.jsx"></script>
<script type="text/babel" src="src/signup.jsx"></script>

<!-- Manifesto specifics -->
<script type="text/babel" src="src/manifesto-base.jsx"></script>
<script type="text/babel" src="src/manifesto-dossier.jsx"></script>
<script type="text/babel" src="src/manifesto-editorial.jsx"></script>
<script type="text/babel" src="src/manifesto.jsx"></script>

<script type="text/babel">
  const { useState } = React;
  const styleEl = document.createElement('style');
  styleEl.textContent = window.typeStyles;
  document.head.appendChild(styleEl);

  function App() {
    const [signupOpen, setSignupOpen] = useState(false);
    return (
      <div id="stage">
        <Manifesto onOpenSignup={()=>setSignupOpen(true)}/>
        <SignupModal open={signupOpen} onClose={()=>setSignupOpen(false)}/>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
